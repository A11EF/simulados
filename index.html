<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="Importe provas, responda no seu ritmo e acompanhe seus resultados."
    />
    <title>Simula — seu espaço de estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#" data-view-link="overview" aria-label="Simula, início">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect x="3" y="3" width="26" height="26" rx="9" fill="currentColor" />
              <path d="M10 16.4l4 4 8-9" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span>simula<span class="brand-dot">.</span></span>
        </a>

        <div class="sidebar-label">MENU</div>
        <nav class="main-nav">
          <button class="nav-link is-active" data-view="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="8" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/></svg>
            <span>Visão geral</span>
          </button>
          <button class="nav-link" data-view="exams">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h-2a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="8" y="2" width="8" height="4" rx="1.5"/><path d="M8 12h8M8 16h5"/></svg>
            <span>Meus simulados</span>
          </button>
          <button class="nav-link" data-view="results">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17"/><path d="M8 15l4-4 3 2 5-6"/></svg>
            <span>Resultados</span>
          </button>
        </nav>

        <div class="sidebar-tip">
          <div class="tip-icon" aria-hidden="true">✦</div>
          <strong>Um passo de cada vez.</strong>
          <p>Seu progresso começa quando você pratica.</p>
        </div>
        <div class="sidebar-footer">
          <span class="avatar">E</span>
          <span class="profile-copy"><strong>Estudante</strong><small>Seu espaço pessoal</small></span>
          <span class="profile-menu" aria-hidden="true">•••</span>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Seu espaço</span><span class="breadcrumb-slash">/</span><strong id="page-name">Visão geral</strong></div>
          <div class="topbar-actions">
            <span class="today-label" id="today-label"></span>
            <button class="icon-button help-button" aria-label="Sobre o Simula" data-action="about">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.8 1.7c-1 .9-1.6 1.2-1.6 2.8M12 17h.01"/></svg>
            </button>
            <button class="primary-button top-create" data-action="create">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span>Novo simulado</span>
            </button>
          </div>
        </header>

        <div id="app-content" class="content-area" aria-live="polite"></div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Navegação mobile">
      <button class="mobile-nav-link is-active" data-view="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="8" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/></svg><span>Início</span>
      </button>
      <button class="mobile-nav-link" data-view="exams">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h-2a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect x="8" y="2" width="8" height="4" rx="1.5"/><path d="M8 12h8M8 16h5"/></svg><span>Simulados</span>
      </button>
      <button class="mobile-nav-link" data-view="results">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17"/><path d="M8 15l4-4 3 2 5-6"/></svg><span>Resultados</span>
      </button>
      <button class="mobile-nav-link mobile-add" data-action="create" aria-label="Criar simulado">
        <span class="mobile-add-icon">+</span><span>Criar</span>
      </button>
    </nav>

    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
